# -- general
# prefix
unbind C-b
set -g prefix 'C-Space' # 设置全局前缀

# 鼠标支持
set -g mouse on
# 开启键盘扩展（比如上下左右按键）
set -s extended-keys on
set -as terminal-features 'kitty*:extkeys'

set -s focus-events on

# 增加Buffer容量,扩展到10000行
set -g history-limit 10000

# 编号显示从1开始
set -g base-index 1
setw -g pane-base-index 1

# 窗口重命名
setw -g automatic-rename on
set -g renumber-windows on

# 终端标题设置
set -g set-titles on
set -g set-titles-string "#S:#W"

# 提示时长设置
# set -g display-time 2000
set -g display-panes-time 2000

# 时间设定
set -sg repeat-time 300
# set -s escape-time 0 # 在tmux-sensible插件中包含

# session and window的生命周期管理
set -sg exit-empty on # 最后一个session关闭，tmux自动中断进程
set -g detach-on-destroy off
set -g allow-passthrough on

# default shell 不在这里写死，由两个桌面各自的快捷键决定：
#   niri  → /usr/bin/zsh  （config.kdl 的 environment{} 里 SHELL=zsh）
#   river → /usr/bin/bash （init 里 export SHELL=bash）
# 打开终端时执行 tmux set-option -g default-shell <shell>，
# 这样同一个 tmux server 在两个桌面下各自用对的 shell。

# notification and warning
set -g visual-activity off
set -g monitor-bell off

# environment
set -ga update-environment '\
QT_IM_MODULE QT_QPA_PLATFORMTHEME \
SESSION_MANAGER \
XDG_CONFIG_HOME XDG_CACHE_HOME XDG_DATA_HOME\
XDG_MENU_PREFIX XDG_RUNTIME_DIR XDG_SESSION_CLASS \
XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_CURRENT_DESKTOP \
XMODIFIERS \
FZF_DEFAULT_OPTS \
TMUX_THEME_COLOR \
TERM TERM_PROGRAM \
'

# -- session
# ctrl A (prefix) + 大写C创建一个新的session
bind C command-prompt -p "new session name: " "new -s '%%'"

# -- windows
bind C-l send-keys 'C-l'

# -- pane
bind | split-window -h # 垂直分割当前窗口
bind _ split-window -v # 水平分割当前窗口

# -- agent inter-session collaboration
# 两个 prompt：目标 session + 消息（%1/%2 分别对应两次输入）
bind A command-prompt -p "send to session:,message:" "run-shell '~/.config/tmux/agent/send-to-session.sh \"%1\" \"%2\"'"
bind B command-prompt -p "broadcast message:" "run-shell '~/.config/tmux/agent/broadcast.sh \"%1\"'"
# 注：原本的 bind X（complete-session.sh）用于弹出"任务完成"桌面通知，已按要求关闭。

# 真彩支持
# set -g default-terminal "xterm-kitty"
set-option -g default-terminal "tmux-256color"

# -- plugins, TPM tmux plugin manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# 主题插件：TPM 只负责安装/更新，实际应用由 themes/apply.sh 统一处理
# 可用主题见 ~/.config/tmux/themes/*.conf；prefix+T 打开主题菜单
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
set -g @plugin 'catppuccin/tmux' 
set -g @catppuccin_flavor 'macchiato'
# session 重新编号
set -g @plugin 'T1erno/tmux-auto-renumber-session'
# 关机后也可以实现session持久化
set -g @plugin 'tmux-plugins/tmux-resurrect' # 注意：该插件可以仅保存系统重启后的布局
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'  # 每 15 分钟自动保存一次
set -g @continuum-restore 'on'        # 启动 tmux 时自动恢复

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '$HOME/.config/tmux/plugins/tpm/tpm'

# -- 主题：themes/ 下一个 .conf 一个主题
# 启动时恢复上次选择；prefix+T 打开主题菜单（tmux display-menu）
run-shell '~/.config/tmux/themes/apply.sh'
bind T run-shell '~/.config/tmux/themes/menu.sh'

# -- agent workflow hooks (must be after TPM initialization)
# 新 session 创建时：初始化工作目录 + 注册跟踪文件
set-hook -ga after-new-session "run-shell '$HOME/.config/tmux/agent/setup-session.sh \"#{session_name}\"'"

# 注：原本的 session-closed hook（on-session-close.sh）会在 agent session 结束时
# 发桌面通知 + 终端铃，与 complete-session.sh 重复。通知能力已按要求全部关闭。
