# Gruvbox Dark
set -g @tmux-gruvbox "dark"
run-shell "bash $HOME/.config/tmux/plugins/tmux-gruvbox/gruvbox-tpm.tmux >/dev/null 2>&1"

# tmux 弹窗（主题菜单等）跟随 gruvbox
set -g menu-style "bg=#3c3836,fg=#ebdbb2"
set -g menu-selected-style "bg=#fabd2f,fg=#3c3836,bold"
set -g menu-border-style "bg=#3c3836,fg=#665c54"
set -g menu-border-lines rounded
