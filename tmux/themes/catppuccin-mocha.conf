# Catppuccin Mocha
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_reset "true"
run-shell "bash $HOME/.config/tmux/plugins/tmux/catppuccin.tmux >/dev/null 2>&1"

# tmux 弹窗跟随 mocha
set -g menu-style "bg=#181825,fg=#cdd6f4"
set -g menu-selected-style "bg=#cba6f7,fg=#1e1e2e,bold"
set -g menu-border-style "bg=#181825,fg=#6c7086"
set -g menu-border-lines rounded
