# Catppuccin Macchiato（默认）
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_reset "true"
run-shell "bash $HOME/.config/tmux/plugins/tmux/catppuccin.tmux >/dev/null 2>&1"

# tmux 弹窗跟随 macchiato
set -g menu-style "bg=#1e2030,fg=#cad3f5"
set -g menu-selected-style "bg=#c6a0f6,fg=#24273a,bold"
set -g menu-border-style "bg=#1e2030,fg=#6e738d"
set -g menu-border-lines rounded
