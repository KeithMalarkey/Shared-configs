# vault：琥珀磷光 + 牛油果绿，和 foot / river / fuzzel 统一
set -g status-style "bg=#0a0a00,fg=#c8b400"

set -g status-left-length 30
set -g status-left "#[fg=#0a0a00,bg=#c8b400,bold] #S #[fg=#88b04b,bg=#c8b400]▕#[default]"

set -g status-right-length 60
set -g status-right "#[fg=#5a5200] %y-%m-%d #[fg=#88b04b]│ #[fg=#c8b400,bold]%H:%M #[default]"

set -g window-status-separator ""
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g window-status-format "#[fg=#5a5200] #I:#W #[fg=#5a5200,bg=#0a0a00]▕"
set -g window-status-current-format "#[fg=#0a0a00,bg=#88b04b,bold] #I:#W #[fg=#c8b400,bg=#88b04b]▕"

set -g pane-border-style "fg=#2a3a1a"
set -g pane-active-border-style "fg=#88b04b"
set -g message-style "fg=#0a0a00,bg=#c8b400"
set -g message-command-style "fg=#0a0a00,bg=#88b04b"
set -g mode-style "fg=#0a0a00,bg=#88b04b"
set -g clock-mode-colour "#c8b400"

# tmux 弹窗（含 prefix+T 主题菜单）跟随 vault 配色
set -g menu-style "bg=#0a0a00,fg=#c8b400"
set -g menu-selected-style "bg=#88b04b,fg=#0a0a00,bold"
set -g menu-border-style "bg=#0a0a00,fg=#88b04b"
set -g menu-border-lines rounded
