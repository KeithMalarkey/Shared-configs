# Catppuccin Frappe
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_reset "true"
run-shell "bash $HOME/.config/tmux/plugins/tmux/catppuccin.tmux >/dev/null 2>&1"

# tmux 弹窗跟随 frappe
set -g menu-style "bg=#292c3c,fg=#c6d0f5"
set -g menu-selected-style "bg=#ca9ee6,fg=#303446,bold"
set -g menu-border-style "bg=#292c3c,fg=#737994"
set -g menu-border-lines rounded
