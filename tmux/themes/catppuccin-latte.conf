# Catppuccin Latte（浅色）
set -g @catppuccin_flavor "latte"
set -g @catppuccin_reset "true"
run-shell "bash $HOME/.config/tmux/plugins/tmux/catppuccin.tmux >/dev/null 2>&1"

# tmux 弹窗跟随 latte
set -g menu-style "bg=#e6e9ef,fg=#4c4f69"
set -g menu-selected-style "bg=#8839ef,fg=#eff1f5,bold"
set -g menu-border-style "bg=#e6e9ef,fg=#9ca0b0"
set -g menu-border-lines rounded
